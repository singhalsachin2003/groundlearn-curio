# Installs a finished EAS build on an Android emulator, opens it, and saves the crash log
# and screenshots as a downloadable artifact. Run it from the Actions tab.
# Leave build_id empty to test the newest finished preview APK.
name: Emulator test
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id (empty = newest preview, waits for it)
        type: string
        default: ''
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        run: npm --prefix app ci
      - name: Download the APK
        working-directory: app
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            eas build:view "${{ inputs.build_id }}" --json > build.json
          else
            # Newest preview build; if it is still building, wait for it (up to 40 min).
            for i in $(seq 1 80); do
              eas build:list --platform android --profile preview --limit 1 --json --non-interactive > list.json
              st=$(node -e "console.log(require('./list.json')[0].status)")
              echo "newest preview build: $st"
              case "$st" in FINISHED) break;; ERRORED|CANCELED) exit 1;; esac
              sleep 30
            done
            node -e "console.log(JSON.stringify(require('./list.json')[0]))" > build.json
          fi
          node -e "const b=require('./build.json');console.log('build',b.id,b.appVersion,b.gitCommitHash);console.log(b.artifacts.buildUrl)"
          curl -sSL -o "$GITHUB_WORKSPACE/curio.apk" "$(node -e "console.log(require('./build.json').artifacts.buildUrl)")"
          ls -la "$GITHUB_WORKSPACE/curio.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: out/
